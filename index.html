<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker - Cloud Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ========================================
    // FIREBASE CONFIGURATION
    // ========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCmDtl8Ys1kcig0zlmJMeH99hyOg5SrVaQ",
      authDomain: "learning-tracker-5bcf7.firebaseapp.com",
      projectId: "learning-tracker-5bcf7",
      storageBucket: "learning-tracker-5bcf7.firebasestorage.app",
      messagingSenderId: "87118503374",
      appId: "1:87118503374:web:ed02c9f9a9a7bd2fe21f9f",
      measurementId: "G-Y1D0ZZT9XP"
    };

    // Initialize Firebase
    let firebaseApp, auth, db;
    try {
      firebaseApp = firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (error) {
      console.error("Firebase initialization error:", error);
    }

    // Lucide Icons
    const Clock = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    );

    const Plus = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    );

    const X = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    );

    const Edit2 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
      </svg>
    );

    const BarChart3 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M3 3v18h18"/>
        <path d="M18 17V9"/>
        <path d="M13 17V5"/>
        <path d="M8 17v-3"/>
      </svg>
    );

    const Calendar = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    );

    const LogOut = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    );

    const User = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    );

    // Auth Component
    function AuthScreen({ onAuthSuccess }) {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
          onAuthSuccess();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
          <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-500 rounded-2xl mb-4">
                <Clock className="w-8 h-8 text-white" />
              </div>
              <h1 className="text-3xl font-bold mb-2" style={{ fontFamily: 'Georgia, serif' }}>
                Time Tracker
              </h1>
              <p className="text-gray-500">
                {isSignUp ? 'Create your account' : 'Sign in to your account'}
              </p>
            </div>

            {error && (
              <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                {error}
              </div>
            )}

            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">
                  Email
                </label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
                  required
                  disabled={loading}
                />
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">
                  Password
                </label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
                  required
                  disabled={loading}
                  minLength={6}
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 bg-blue-500 text-white rounded-xl font-medium hover:bg-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
              >
                {loading ? 'Please wait...' : (isSignUp ? 'Sign Up' : 'Sign In')}
              </button>
            </form>

            <div className="mt-6 text-center">
              <button
                onClick={() => {
                  setIsSignUp(!isSignUp);
                  setError('');
                }}
                className="text-blue-500 hover:text-blue-600 text-sm font-medium"
              >
                {isSignUp ? 'Already have an account? Sign in' : "Don't have an account? Sign up"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Main Time Tracker Component
    function TimeTracker() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [buttons, setButtons] = useState([
        { id: 1, title: 'Work', color: '#4A90E2', activeSession: null },
        { id: 2, title: 'Personal', color: '#E24A4A', activeSession: null },
        { id: 3, title: 'Study', color: '#50C878', activeSession: null }
      ]);
      const [sessions, setSessions] = useState([]);
      const [editingButton, setEditingButton] = useState(null);
      const [editTitle, setEditTitle] = useState('');
      const [currentTab, setCurrentTab] = useState('home');
      const [currentTime, setCurrentTime] = useState(new Date());
      const [editingSession, setEditingSession] = useState(null);
      const [editSessionData, setEditSessionData] = useState(null);
      const [syncing, setSyncing] = useState(false);
      const [aiInsights, setAiInsights] = useState(null);
      const [loadingAiInsights, setLoadingAiInsights] = useState(false);
      const [showAiInsights, setShowAiInsights] = useState(false);

      // Auth state listener
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          setUser(user);
          setLoading(false);
        });
        return unsubscribe;
      }, []);

      // Load data from Firestore when user logs in
      useEffect(() => {
        if (user) {
          loadUserData();
        }
      }, [user]);

      // Clock timer
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const loadUserData = async () => {
        try {
          setSyncing(true);
          
          // Load buttons
          const buttonsDoc = await db.collection('users').doc(user.uid).collection('settings').doc('buttons').get();
          if (buttonsDoc.exists) {
            setButtons(buttonsDoc.data().buttons);
          }

          // Load sessions
          const sessionsSnapshot = await db.collection('users').doc(user.uid).collection('sessions').get();
          const loadedSessions = sessionsSnapshot.docs.map(doc => {
            const data = doc.data();
            return {
              id: doc.id,
              ...data,
              startTime: data.startTime.toDate(),
              endTime: data.endTime.toDate()
            };
          });
          setSessions(loadedSessions);
        } catch (error) {
          console.error('Error loading data:', error);
        } finally {
          setSyncing(false);
        }
      };

      const saveButtons = async (newButtons) => {
        setButtons(newButtons);
        if (user) {
          try {
            await db.collection('users').doc(user.uid).collection('settings').doc('buttons').set({
              buttons: newButtons
            });
          } catch (error) {
            console.error('Error saving buttons:', error);
          }
        }
      };

      const saveSession = async (session) => {
        setSessions(prev => [...prev, session]);
        if (user) {
          try {
            await db.collection('users').doc(user.uid).collection('sessions').doc(session.id.toString()).set({
              buttonId: session.buttonId,
              buttonTitle: session.buttonTitle,
              buttonColor: session.buttonColor,
              startTime: firebase.firestore.Timestamp.fromDate(session.startTime),
              endTime: firebase.firestore.Timestamp.fromDate(session.endTime),
              duration: session.duration
            });
          } catch (error) {
            console.error('Error saving session:', error);
          }
        }
      };

      const updateSession = async (sessionId, updates) => {
        setSessions(sessions.map(s => s.id === sessionId ? { ...s, ...updates } : s));
        if (user) {
          try {
            await db.collection('users').doc(user.uid).collection('sessions').doc(sessionId.toString()).update({
              startTime: firebase.firestore.Timestamp.fromDate(updates.startTime),
              endTime: firebase.firestore.Timestamp.fromDate(updates.endTime),
              duration: updates.duration
            });
          } catch (error) {
            console.error('Error updating session:', error);
          }
        }
      };

      const deleteSessionFromDb = async (sessionId) => {
        setSessions(sessions.filter(s => s.id !== sessionId));
        if (user) {
          try {
            await db.collection('users').doc(user.uid).collection('sessions').doc(sessionId.toString()).delete();
          } catch (error) {
            console.error('Error deleting session:', error);
          }
        }
      };

      const handleSignOut = async () => {
        try {
          await auth.signOut();
        } catch (error) {
          console.error('Error signing out:', error);
        }
      };

      const formatDuration = (ms) => {
        const seconds = Math.floor(ms / 1000);
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const handleClockToggle = (buttonId) => {
        const button = buttons.find(b => b.id === buttonId);
        
        if (button.activeSession) {
          const endTime = new Date();
          const duration = endTime - button.activeSession.startTime;
          
          const newSession = {
            id: Date.now(),
            buttonId,
            buttonTitle: button.title,
            buttonColor: button.color,
            startTime: button.activeSession.startTime,
            endTime,
            duration
          };
          
          saveSession(newSession);
          saveButtons(buttons.map(b => 
            b.id === buttonId ? { ...b, activeSession: null } : b
          ));
        } else {
          const now = new Date();
          const completedSessions = [];
          
          buttons.forEach(b => {
            if (b.activeSession) {
              const duration = now - b.activeSession.startTime;
              completedSessions.push({
                id: Date.now() + b.id,
                buttonId: b.id,
                buttonTitle: b.title,
                buttonColor: b.color,
                startTime: b.activeSession.startTime,
                endTime: now,
                duration
              });
            }
          });
          
          completedSessions.forEach(session => saveSession(session));
          
          saveButtons(buttons.map(b => 
            b.id === buttonId 
              ? { ...b, activeSession: { startTime: now } }
              : { ...b, activeSession: null }
          ));
        }
      };

      const addButton = () => {
        const colors = ['#9B59B6', '#F39C12', '#1ABC9C', '#E67E22', '#3498DB', '#E91E63'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        
        saveButtons([...buttons, {
          id: Date.now(),
          title: 'New Category',
          color: randomColor,
          activeSession: null
        }]);
      };

      const removeButton = (buttonId) => {
        if (buttons.length > 1) {
          saveButtons(buttons.filter(b => b.id !== buttonId));
        }
      };

      const startEdit = (button) => {
        setEditingButton(button.id);
        setEditTitle(button.title);
      };

      const saveEdit = () => {
        saveButtons(buttons.map(b => 
          b.id === editingButton ? { ...b, title: editTitle } : b
        ));
        setEditingButton(null);
      };

      const startEditSession = (session) => {
        setEditingSession(session.id);
        setEditSessionData({
          startTime: new Date(session.startTime).toISOString().slice(0, 16),
          endTime: new Date(session.endTime).toISOString().slice(0, 16)
        });
      };

      const saveSessionEdit = () => {
        const startTime = new Date(editSessionData.startTime);
        const endTime = new Date(editSessionData.endTime);
        const duration = endTime - startTime;

        if (duration > 0) {
          updateSession(editingSession, { startTime, endTime, duration });
        }
        setEditingSession(null);
      };

      const getActiveSessionDuration = (button) => {
        if (!button.activeSession) return 0;
        return currentTime - button.activeSession.startTime;
      };

      const getDailyStats = () => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const todaySessions = sessions.filter(s => s.startTime >= today);
        
        const stats = {};
        buttons.forEach(button => {
          const buttonSessions = todaySessions.filter(s => s.buttonId === button.id);
          const totalMs = buttonSessions.reduce((sum, s) => sum + s.duration, 0);
          const activeMs = button.activeSession ? getActiveSessionDuration(button) : 0;
          
          stats[button.id] = {
            title: button.title,
            color: button.color,
            duration: totalMs + activeMs,
            sessionCount: buttonSessions.length + (button.activeSession ? 1 : 0)
          };
        });
        
        return stats;
      };

      const getWeeklyStats = () => {
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        weekAgo.setHours(0, 0, 0, 0);
        
        const weekSessions = sessions.filter(s => s.startTime >= weekAgo);
        
        const stats = {};
        buttons.forEach(button => {
          const buttonSessions = weekSessions.filter(s => s.buttonId === button.id);
          const totalMs = buttonSessions.reduce((sum, s) => sum + s.duration, 0);
          
          stats[button.id] = {
            title: button.title,
            color: button.color,
            duration: totalMs,
            sessionCount: buttonSessions.length
          };
        });
        
        return stats;
      };

      const getMonthlyStats = () => {
        const monthAgo = new Date();
        monthAgo.setDate(monthAgo.getDate() - 30);
        monthAgo.setHours(0, 0, 0, 0);
        
        const monthSessions = sessions.filter(s => s.startTime >= monthAgo);
        
        const stats = {};
        buttons.forEach(button => {
          const buttonSessions = monthSessions.filter(s => s.buttonId === button.id);
          const totalMs = buttonSessions.reduce((sum, s) => sum + s.duration, 0);
          
          stats[button.id] = {
            title: button.title,
            color: button.color,
            duration: totalMs,
            sessionCount: buttonSessions.length
          };
        });
        
        return stats;
      };

      const getPreviousMonthStats = () => {
        const twoMonthsAgo = new Date();
        twoMonthsAgo.setDate(twoMonthsAgo.getDate() - 60);
        twoMonthsAgo.setHours(0, 0, 0, 0);
        
        const oneMonthAgo = new Date();
        oneMonthAgo.setDate(oneMonthAgo.getDate() - 30);
        oneMonthAgo.setHours(0, 0, 0, 0);
        
        const prevMonthSessions = sessions.filter(s => 
          s.startTime >= twoMonthsAgo && s.startTime < oneMonthAgo
        );
        
        const stats = {};
        buttons.forEach(button => {
          const buttonSessions = prevMonthSessions.filter(s => s.buttonId === button.id);
          const totalMs = buttonSessions.reduce((sum, s) => sum + s.duration, 0);
          
          stats[button.id] = {
            title: button.title,
            color: button.color,
            duration: totalMs
          };
        });
        
        return stats;
      };

      const getDayOfWeekStats = () => {
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        
        const recentSessions = sessions.filter(s => s.startTime >= weekAgo);
        
        const dayStats = {};
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        buttons.forEach(button => {
          const buttonSessions = recentSessions.filter(s => s.buttonId === button.id);
          const byDay = {};
          
          buttonSessions.forEach(session => {
            const day = session.startTime.getDay();
            if (!byDay[day]) byDay[day] = 0;
            byDay[day] += session.duration;
          });
          
          let bestDay = null;
          let maxDuration = 0;
          
          Object.entries(byDay).forEach(([day, duration]) => {
            if (duration > maxDuration) {
              maxDuration = duration;
              bestDay = dayNames[parseInt(day)];
            }
          });
          
          if (bestDay) {
            dayStats[button.id] = {
              title: button.title,
              bestDay,
              duration: maxDuration
            };
          }
        });
        
        return dayStats;
      };

      const generateInsights = () => {
        const insights = [];
        
        if (sessions.length === 0) {
          return [{
            type: 'info',
            message: 'Start tracking time to see insights about your productivity patterns!',
            color: '#6366F1'
          }];
        }
        
        const monthlyStats = getMonthlyStats();
        const prevMonthStats = getPreviousMonthStats();
        const dayStats = getDayOfWeekStats();
        const dailyStats = getDailyStats();
        
        buttons.forEach(button => {
          const current = monthlyStats[button.id]?.duration || 0;
          const previous = prevMonthStats[button.id]?.duration || 0;
          
          if (previous > 0 && current > 0) {
            const percentChange = ((current - previous) / previous) * 100;
            if (Math.abs(percentChange) > 10) {
              insights.push({
                type: percentChange > 0 ? 'up' : 'down',
                title: button.title,
                message: `You're ${percentChange > 0 ? 'up' : 'down'} ${Math.abs(Math.round(percentChange))}% in ${button.title} this month`,
                color: button.color
              });
            }
          } else if (current > 0 && sessions.length > 5) {
            insights.push({
              type: 'new',
              title: button.title,
              message: `You've started tracking ${button.title} this month`,
              color: button.color
            });
          }
        });
        
        Object.values(dayStats).forEach(stat => {
          insights.push({
            type: 'calendar',
            title: stat.title,
            message: `${stat.bestDay} is your most productive day for ${stat.title}`,
            color: buttons.find(b => b.title === stat.title)?.color
          });
        });
        
        const dailyTotal = Object.values(dailyStats).reduce((sum, s) => sum + s.duration, 0);
        if (dailyTotal > 0) {
          const hours = dailyTotal / (1000 * 60 * 60);
          if (hours > 2) {
            insights.push({
              type: 'star',
              message: `Great work today! You've logged ${hours.toFixed(1)} hours across all categories`,
              color: '#FFB800'
            });
          }
        }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        let streak = 0;
        for (let i = 0; i < 7; i++) {
          const day = new Date(today);
          day.setDate(day.getDate() - i);
          const dayEnd = new Date(day);
          dayEnd.setHours(23, 59, 59, 999);
          
          const hasSessions = sessions.some(s => s.startTime >= day && s.startTime <= dayEnd);
          if (hasSessions) {
            streak++;
          } else {
            break;
          }
        }
        
        if (streak >= 3) {
          insights.push({
            type: 'fire',
            message: `You're on a ${streak}-day tracking streak! Keep it up!`,
            color: '#FF6B6B'
          });
        }
        
        if (insights.length === 0 && sessions.length > 0) {
          insights.push({
            type: 'info',
            message: 'Keep tracking! You\'ll see insights after building up more data over time.',
            color: '#6366F1'
          });
        }
        
        return insights;
      };

      const generateAIInsights = async () => {
        setLoadingAiInsights(true);
        setShowAiInsights(true);

        try {
          // Prepare data for analysis
          const dailyStats = getDailyStats();
          const weeklyStats = getWeeklyStats();
          const monthlyStats = getMonthlyStats();
          
          const dailyTotal = Object.values(dailyStats).reduce((sum, s) => sum + s.duration, 0);
          const weeklyTotal = Object.values(weeklyStats).reduce((sum, s) => sum + s.duration, 0);
          const monthlyTotal = Object.values(monthlyStats).reduce((sum, s) => sum + s.duration, 0);

          // Analyze patterns by day of week
          const dayOfWeekData = {};
          const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
          sessions.forEach(s => {
            const day = s.startTime.getDay();
            if (!dayOfWeekData[day]) dayOfWeekData[day] = { total: 0, count: 0 };
            dayOfWeekData[day].total += s.duration;
            dayOfWeekData[day].count += 1;
          });

          // Analyze patterns by time of day
          const hourData = {};
          sessions.forEach(s => {
            const hour = s.startTime.getHours();
            if (!hourData[hour]) hourData[hour] = { total: 0, count: 0 };
            hourData[hour].total += s.duration;
            hourData[hour].count += 1;
          });

          // Find peak day
          let peakDay = null;
          let peakDayValue = 0;
          Object.entries(dayOfWeekData).forEach(([day, data]) => {
            if (data.total > peakDayValue) {
              peakDayValue = data.total;
              peakDay = dayNames[day];
            }
          });

          // Find peak hours
          const peakHours = Object.entries(hourData)
            .sort((a, b) => b[1].total - a[1].total)
            .slice(0, 2)
            .map(([hour]) => {
              const h = parseInt(hour);
              return h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h-12} PM`;
            });

          // Calculate category balance
          const categoryHours = {};
          Object.values(weeklyStats).forEach(stat => {
            categoryHours[stat.title] = (stat.duration / 1000 / 60 / 60).toFixed(1);
          });

          // Generate comprehensive insights
          let insights = [];

          // Header
          insights.push('🎯 PRODUCTIVITY ANALYSIS REPORT\n' + '='.repeat(50) + '\n');

          // 1. Overview
          insights.push('📊 OVERVIEW');
          insights.push(`You've tracked ${sessions.length} total sessions across ${buttons.length} categories.`);
          insights.push(`This week: ${(weeklyTotal / 1000 / 60 / 60).toFixed(1)} hours tracked`);
          insights.push(`Daily average: ${(weeklyTotal / 7 / 1000 / 60 / 60).toFixed(1)} hours\n`);

          // 2. Productivity Patterns
          insights.push('⚡ PRODUCTIVITY PATTERNS');
          if (peakDay) {
            insights.push(`Your most productive day is ${peakDay} with ${(peakDayValue / 1000 / 60 / 60).toFixed(1)} hours tracked.`);
          }
          if (peakHours.length > 0) {
            insights.push(`Peak productivity hours: ${peakHours.join(' and ')}`);
          }

          // Session length analysis
          const avgSessionLength = sessions.reduce((sum, s) => sum + s.duration, 0) / sessions.length;
          const avgMinutes = Math.round(avgSessionLength / 1000 / 60);
          insights.push(`Average session length: ${avgMinutes} minutes`);
          
          if (avgMinutes < 30) {
            insights.push('⚠️ Your sessions are quite short. Consider blocking longer focus periods.');
          } else if (avgMinutes > 120) {
            insights.push('💡 Long sessions detected! Remember to take breaks every 90-120 minutes.');
          } else {
            insights.push('✅ Good session length for maintaining focus!');
          }
          insights.push('');

          // 3. Category Balance
          insights.push('⚖️ CATEGORY BALANCE');
          const sortedCategories = Object.entries(categoryHours).sort((a, b) => parseFloat(b[1]) - parseFloat(a[1]));
          sortedCategories.forEach(([category, hours]) => {
            const percentage = ((parseFloat(hours) / (weeklyTotal / 1000 / 60 / 60)) * 100).toFixed(0);
            insights.push(`${category}: ${hours} hours (${percentage}%)`);
          });

          if (sortedCategories.length > 1) {
            const ratio = parseFloat(sortedCategories[0][1]) / parseFloat(sortedCategories[1][1]);
            if (ratio > 3) {
              insights.push(`\n⚠️ Heavy focus on ${sortedCategories[0][0]}. Consider balancing with other categories.`);
            } else {
              insights.push('\n✅ Good balance across categories!');
            }
          }
          insights.push('');

          // 4. Streak and Consistency
          insights.push('🔥 CONSISTENCY & STREAKS');
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          let currentStreak = 0;
          for (let i = 0; i < 30; i++) {
            const day = new Date(today);
            day.setDate(day.getDate() - i);
            const dayEnd = new Date(day);
            dayEnd.setHours(23, 59, 59, 999);
            
            const hasSessions = sessions.some(s => s.startTime >= day && s.startTime <= dayEnd);
            if (hasSessions) {
              currentStreak++;
            } else if (i > 0) {
              break;
            }
          }

          if (currentStreak > 0) {
            insights.push(`Current streak: ${currentStreak} day${currentStreak > 1 ? 's' : ''}! 🎉`);
            if (currentStreak >= 7) {
              insights.push('🏆 Amazing! You\'ve built a solid tracking habit!');
            } else if (currentStreak >= 3) {
              insights.push('💪 Keep it up! You\'re building momentum!');
            }
          } else {
            insights.push('Start a new tracking streak today! Consistency is key.');
          }
          insights.push('');

          // 5. Recommendations
          insights.push('💡 PERSONALIZED RECOMMENDATIONS');
          
          const recommendations = [];

          // Time-based recommendations
          if (peakHours.length > 0) {
            recommendations.push(`Block ${peakHours[0]} for your most important work - that's when you're naturally most productive.`);
          }

          // Balance recommendations
          if (sortedCategories.length > 1) {
            const topCategory = sortedCategories[0][0];
            const bottomCategory = sortedCategories[sortedCategories.length - 1][0];
            if (parseFloat(sortedCategories[0][1]) > parseFloat(sortedCategories[sortedCategories.length - 1][1]) * 4) {
              recommendations.push(`Consider dedicating more time to ${bottomCategory} - you've only tracked ${sortedCategories[sortedCategories.length - 1][1]} hours this week.`);
            }
          }

          // Session length recommendations
          if (avgMinutes < 25) {
            recommendations.push('Try the Pomodoro Technique: 25-minute focused sessions with 5-minute breaks.');
          } else if (avgMinutes > 90) {
            recommendations.push('Break longer sessions into 90-minute chunks with 15-minute breaks for optimal focus.');
          }

          // Consistency recommendations
          if (currentStreak < 3) {
            recommendations.push('Build a daily tracking habit - even 15 minutes counts! Consistency beats intensity.');
          }

          // Weekly review recommendation
          const now = new Date();
          if (now.getDay() === 0 || now.getDay() === 6) {
            recommendations.push('Perfect time for a weekly review! Reflect on what worked and plan next week.');
          }

          recommendations.forEach((rec, idx) => {
            insights.push(`${idx + 1}. ${rec}`);
          });
          insights.push('');

          // 6. Wins
          insights.push('🎉 WINS TO CELEBRATE');
          const wins = [];

          if (sessions.length >= 50) {
            wins.push(`You've logged ${sessions.length} sessions! That's serious commitment to tracking.`);
          } else if (sessions.length >= 20) {
            wins.push(`${sessions.length} sessions tracked - you're building great data!`);

          if (currentStreak >= 3) {
            wins.push(`${currentStreak}-day tracking streak shows excellent consistency!`);

          if (weeklyTotal > 0) {
            const weeklyHours = (weeklyTotal / 1000 / 60 / 60).toFixed(1);
            wins.push(`${weeklyHours} hours tracked this week - you're staying on top of your time!`);

          if (avgMinutes >= 45 && avgMinutes <= 90) {
            wins.push('Your session lengths are in the sweet spot for deep work!');
          }

          if (wins.length === 0) {
            wins.push('You\'re taking the first step by tracking your time - that\'s a win!');
          }

          wins.forEach(win => insights.push(`✨ ${win}`));

          const finalInsights = insights.join('\n');
          setAiInsights(finalInsights);
        } catch (error) {

                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
                      />
                    </div>
                  </div>
                  <div className="flex gap-3">
                    <button
                      onClick={saveSessionEdit}
                      className="flex-1 py-3 bg-blue-500 text-white rounded-xl font-medium hover:bg-blue-600 transition-colors"
                    >
                      Save
                    </button>
                    <button
                      onClick={() => setEditingSession(null)}
                      className="flex-1 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200 transition-colors"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100">
            <div className="text-center">
              <Clock className="w-12 h-12 mx-auto mb-4 text-blue-500 animate-pulse" />
              <p className="text-gray-500">Loading...</p>
            </div>
          </div>
        );
      }

      if (!user) {
        return <AuthScreen onAuthSuccess={() => {}} />;
      }

      return (
        <div className="h-screen flex flex-col bg-gradient-to-br from-gray-50 to-gray-100">
          {currentTab === 'home' && renderHome()}
          {currentTab === 'insights' && renderInsights()}
          {currentTab === 'history' && renderHistory()}
          
          <div className="border-t bg-white/80 backdrop-blur-lg">
            <div className="flex max-w-md mx-auto">
              <button
                onClick={() => setCurrentTab('home')}
                className={`flex-1 py-4 flex flex-col items-center gap-1 transition-colors ${
                  currentTab === 'home' 
                    ? 'text-blue-600' 
                    : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <Clock className="w-6 h-6" />
                <span className="text-xs font-medium">Home</span>
              </button>
              <button
                onClick={() => setCurrentTab('insights')}
                className={`flex-1 py-4 flex flex-col items-center gap-1 transition-colors ${
                  currentTab === 'insights' 
                    ? 'text-blue-600' 
                    : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <BarChart3 className="w-6 h-6" />
                <span className="text-xs font-medium">Insights</span>
              </button>
              <button
                onClick={() => setCurrentTab('history')}
                className={`flex-1 py-4 flex flex-col items-center gap-1 transition-colors ${
                  currentTab === 'history' 
                    ? 'text-blue-600' 
                    : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <Calendar className="w-6 h-6" />
                <span className="text-xs font-medium">History</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<TimeTracker />, document.getElementById('root'));
  </script>
</body>
</html>
